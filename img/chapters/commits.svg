<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="t">
  <title id="t">Commit-historia pizzoina: jokainen commit osoittaa omaan parent-commitiinsa ja ensimmäisen parent on None</title>
  <rect x="1" y="1" width="318" height="168" rx="14" fill="#fbf7f0" stroke="#dcd8ce"/>
  <defs>
    <g id="pizza">
      <circle r="24" fill="#e7b25b" stroke="#b7802a" stroke-width="3"/>
      <circle r="19" fill="#c8452c"/>
      <circle r="17" fill="#f3d27a" opacity=".85"/>
      <g fill="#a4262c"><circle cx="-7" cy="-6" r="4"/><circle cx="8" cy="-3" r="4"/><circle cx="-2" cy="8" r="4"/></g>
      <g fill="#2d6a4f"><circle cx="6" cy="9" r="2"/><circle cx="-10" cy="4" r="2"/><circle cx="1" cy="-11" r="2"/></g>
      <path d="M0 0 L0 -19 M0 0 L16 10 M0 0 L-16 10" stroke="#e7b25b" stroke-width="1.5"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6b70"/>
    </marker>
  </defs>
  <!-- nuolet osoittavat parent-committiin -->
  <g stroke="#5f6b70" stroke-width="2" marker-end="url(#arrow)">
    <line x1="114" y1="76" x2="76" y2="76"/>
    <line x1="206" y1="76" x2="168" y2="76"/>
    <line x1="280" y1="76" x2="260" y2="76"/>
  </g>
  <use href="#pizza" x="46" y="76"/>
  <use href="#pizza" x="138" y="76"/>
  <use href="#pizza" x="230" y="76"/>
  <g transform="translate(310 76)">
    <path d="M0 0 L-24 -12 A27 27 0 0 1 -24 12 z" fill="#e7b25b" stroke="#b7802a" stroke-width="2.5"/>
    <circle cx="-15" cy="0" r="3.5" fill="#a4262c"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1c2327">
    <text x="46" y="122">7b9f1e</text>
    <text x="138" y="122">a3d8e7</text>
    <text x="230" y="122">4f2a1d</text>
    <text x="298" y="122">…</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" text-anchor="middle" fill="#5f6b70">
    <text x="46" y="138">Parent: None</text>
    <text x="138" y="138">Parent: 7b9f1e</text>
    <text x="230" y="138">Parent: a3d8e7</text>
  </g>
  <text x="18" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#5f6b70">pizza-commits.txt</text>
</svg>
